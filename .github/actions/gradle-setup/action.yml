name: Gradle Setup
description: Setup Java and Gradle for KMP builds
inputs:
  cache_read_only:
    description: 'Whether Gradle cache is read-only'
    default: 'true'
  develocity_access_key:
    description: 'Access key for the OSS Community Develocity Instance (Build Scan publishing and remote cache writes)'
    required: false
runs:
  using: composite
  steps:
    - name: Copy CI Gradle properties
      shell: bash
      run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

    - name: Set up JDK 25
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '25.0.4+101.0.LTS'
        distribution: 'temurin'

    - name: Make gradlew executable
      shell: bash
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-read-only: ${{ inputs.cache_read_only }}
        cache-cleanup: on-success
        add-job-summary: always
        develocity-access-key: ${{ inputs.develocity_access_key }}
