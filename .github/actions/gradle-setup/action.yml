name: Gradle Setup
description: Setup Java and Gradle for KMP builds
inputs:
  cache_read_only:
    description: 'Whether Gradle cache is read-only'
    default: 'true'
  develocity_access_key:
    description: 'Access key for the OSS Community Develocity Instance (Build Scan publishing and remote cache writes)'
    required: false
runs:
  using: composite
  steps:
    - name: Copy CI Gradle properties
      shell: bash
      run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

    - name: Set up JDK 25
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: '25.0.5+8.0.LTS'
        distribution: 'temurin'

    - name: Make gradlew executable
      shell: bash
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-read-only: ${{ inputs.cache_read_only }}
        cache-cleanup: on-success
        add-job-summary: always
        develocity-access-key: ${{ inputs.develocity_access_key }}
