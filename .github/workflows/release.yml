name: Release

# Dispatch from main with the version a merged release PR cut in CHANGELOG.md, or push its tag.
# Every gate runs before the tag is pushed, so a refused release leaves no tag behind.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.9.1 (CI creates the vX.Y.Z tag)'
        required: true
        type: string
      dry_run:
        description: 'Run every gate and stage the artifacts, but tag, publish and release nothing'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Gate, publish to Maven Central & release
    # Kotlin/Native cross-compiles the Apple klibs from Linux, so Linux publishes every target.
    # It cannot run the Apple tests; the green-CI gate covers them.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      attestations: write
      checks: read
      statuses: read
    env:
      DRY_RUN: ${{ inputs.dry_run || false }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          REQUESTED: ${{ inputs.version || github.ref_name }}
        run: |
          # A dispatch takes the bare version so the concurrency group above is canonical.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "${REQUESTED#v}" != "$REQUESTED" ]; then
            echo "::error::pass the version without a leading v: ${REQUESTED#v}"
            exit 1
          fi
          V="${REQUESTED#v}"
          # settings.gradle.kts reads only vX.Y.Z tags as releases, so nothing else can release.
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$REQUESTED' is not a MAJOR.MINOR.PATCH release version"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Release from main only
        if: env.DRY_RUN != 'true'
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF is not on main; release from main (dry_run may run anywhere)"
            exit 1
          fi

      - name: Verify an existing tag points at this commit
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          git fetch --quiet --force origin "refs/tags/v$V:refs/tags/v$V" 2>/dev/null || true
          if git rev-parse --quiet --verify "v$V^{commit}" >/dev/null &&
             [ "$(git rev-parse "v$V^{commit}")" != "$(git rev-parse HEAD)" ]; then
            if [ "$DRY_RUN" = true ]; then
              echo "::warning::v$V already exists on another commit; a real release would stop here"
            else
              echo "::error::v$V already exists on another commit"
              exit 1
            fi
          fi
          echo "releasing $V from $(git rev-parse --short HEAD)"

      - name: Render release notes
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          scripts/changelog.sh notes "$V" > release-notes.md
          cat release-notes.md

      # CI does not run on tags, so the Apple tests this runner cannot execute are only
      # guaranteed by the required checks having passed on this exact commit.
      - name: Require green CI on the commit being released
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-checks.sh green-ci "$(git rev-parse HEAD)"

      # The version comes from git describe (settings.gradle.kts), so the tag exists locally before
      # Gradle runs. It reaches origin only at "Push the release tag", and never on a dry run.
      - name: Tag the release locally
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$(git rev-parse --quiet --verify "v$V^{commit}")" != "$(git rev-parse HEAD)" ]; then
            git tag -f -a "v$V" -m "v$V"
          fi
          DESCRIBED=$(git describe --tags --match 'v*' --exclude 'v*-*')
          if [ "$DESCRIBED" != "v$V" ]; then
            echo "::error::git describe resolves this commit to $DESCRIBED, not v$V"
            exit 1
          fi
          echo "git describe: $DESCRIBED"

      - uses: ./.github/actions/gradle-setup
        with:
          cache_read_only: 'false'
          develocity_access_key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

      - name: Cache Konan (Kotlin/Native toolchain)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Validate before publish
        run: >-
          ./gradlew spotlessCheck detektAll jvmTest apiCheck
          -PVERSION_NAME=${{ steps.version.outputs.version }} --stacktrace

      - name: Stage signed artifacts locally
        run: >-
          ./gradlew publishToMavenLocal
          -PVERSION_NAME=${{ steps.version.outputs.version }} --stacktrace
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      - name: Refuse a -SNAPSHOT dependency
        run: scripts/release-checks.sh no-snapshots "${{ steps.version.outputs.version }}"

      - name: Collect every staged artifact for attestation
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p maven-staging
          cd ~/.m2/repository
          find org/meshtastic -path "*/$V/*" -type f \
            -not -name "maven-metadata*" \
            -not -name "*.asc" \
            -not -name "*.md5" \
            -not -name "*.sha1" \
            -not -name "*.sha256" \
            -not -name "*.sha512" \
            | while IFS= read -r f; do
              mkdir -p "$GITHUB_WORKSPACE/maven-staging/$(dirname "$f")"
              cp "$f" "$GITHUB_WORKSPACE/maven-staging/$f"
            done
          find "$GITHUB_WORKSPACE/maven-staging" -type f | sed "s|^$GITHUB_WORKSPACE/maven-staging/||" | sort

      - name: Attest the staged artifacts
        if: env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: maven-staging/**/*

      - name: Check Maven Central state
        # Sonatype rejects a re-upload, so a re-run after a partial release skips the publish.
        id: central
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          # Only a 404 means unpublished; anything else stops the release rather than guess.
          for _ in 1 2 3 4 5; do
            HTTP=$(curl -sS -o /dev/null -w "%{http_code}" \
              "https://repo1.maven.org/maven2/org/meshtastic/mqtt-client-core/$V/mqtt-client-core-$V.pom" || echo 000)
            echo "Maven Central POM probe for $V: HTTP $HTTP"
            case "$HTTP" in
              200) echo "published=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              404) echo "published=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            sleep 20
          done
          echo "::error::Maven Central did not answer 200 or 404 for $V"
          exit 1

      - name: Push the release tag
        if: env.DRY_RUN != 'true'
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "v$V already on origin"
            exit 0
          fi
          git push origin "refs/tags/v$V"

      - name: Publish to Maven Central
        if: env.DRY_RUN != 'true' && steps.central.outputs.published != 'true'
        run: >-
          ./gradlew publishAndReleaseToMavenCentral
          -PVERSION_NAME=${{ steps.version.outputs.version }} --no-configuration-cache --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      - name: Create or update the GitHub Release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: release-notes.md

      - name: Dry-run summary
        if: env.DRY_RUN == 'true'
        run: echo "dry run passed every gate for ${{ steps.version.outputs.version }}; nothing was tagged, published or released"

  sample-artifacts:
    name: Build sample (${{ matrix.label }})
    needs: [release]
    if: inputs.dry_run != true
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            tasks: >-
              :sample:androidApp:assembleRelease
              :sample:packageReleaseDistributionForCurrentOS
              :sample:wasmJsBrowserDistribution
            artifact_glob: |
              sample/androidApp/build/outputs/apk/release/*.apk
              sample/build/compose/binaries/main-release/deb/*.deb
            web_zip: true
          - os: macos-15
            label: macos-arm64
            tasks: :sample:packageReleaseDistributionForCurrentOS
            artifact_glob: |
              sample/build/compose/binaries/main-release/dmg/*.dmg
            web_zip: false
          - os: windows-latest
            label: windows-x64
            tasks: :sample:packageReleaseDistributionForCurrentOS
            artifact_glob: |
              sample/build/compose/binaries/main-release/msi/*.msi
            web_zip: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          submodules: true
          fetch-depth: 0

      - uses: ./.github/actions/gradle-setup
        with:
          cache_read_only: 'false'
          develocity_access_key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

      - name: Build sample artifacts
        shell: bash
        run: ./gradlew ${{ matrix.tasks }} -PVERSION_NAME=${{ needs.release.outputs.version }} --stacktrace

      - name: Zip wasmJs browser distribution
        if: matrix.web_zip == true
        shell: bash
        run: |
          cd sample/build/dist/wasmJs/productionExecutable
          zip -r "${GITHUB_WORKSPACE}/mqtt-sample-web-wasmjs.zip" .

      - name: Collect release assets
        id: collect
        shell: bash
        run: |
          mkdir -p release-assets
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            # shellcheck disable=SC2086
            for f in $pattern; do
              [ -e "$f" ] || continue
              if [ -d "$f" ]; then continue; fi
              cp "$f" release-assets/
            done
          done <<< "${{ matrix.artifact_glob }}"
          if [ "${{ matrix.web_zip }}" = "true" ] && [ -f "mqtt-sample-web-wasmjs.zip" ]; then
            cp mqtt-sample-web-wasmjs.zip release-assets/
          fi
          ls -la release-assets/
          echo "count=$(find release-assets -type f | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Attach to GitHub Release
        if: steps.collect.outputs.count != '0'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: release-assets/*
          fail_on_unmatched_files: false

      - name: Attest sample artifacts
        if: steps.collect.outputs.count != '0'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

  sbom:
    name: SBOM & Provenance
    needs: [release]
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          submodules: true
          fetch-depth: 0

      - name: Generate SBOM (CycloneDX + SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: true
          upload-release-assets: true

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: true

      - name: Attach SBOMs to GitHub Release
        # anchore/sbom-action only auto-uploads release assets on tag/release
        # events; on workflow_dispatch attach explicitly.
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: |
            sbom.cdx.json
            sbom.spdx.json
          fail_on_unmatched_files: false

      - name: Attest build provenance for release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            sbom.cdx.json
            sbom.spdx.json
