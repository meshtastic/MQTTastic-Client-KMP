name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    # Weekly scan, Mondays 06:42 UTC, to catch new queries Google/GitHub publish.
    - cron: '42 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # `none`, not `manual`: a traced build loads CodeQL's Kotlin compiler
          # plugin, which refuses a Kotlin it does not know - "version 2.4.20 is
          # too recent, CodeQL currently supports versions below 2.4.20" - and
          # takes the whole job down as a configuration error. Buildless
          # extraction never loads it, so this does not break again on the next
          # Kotlin bump. Move back to `manual` only once CodeQL's ceiling is
          # above the Kotlin in `libs.versions.toml`.
          - language: java-kotlin
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:${{ matrix.language }}
