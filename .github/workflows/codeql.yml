name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    # Weekly scan, Mondays 06:42 UTC, to catch new queries Google/GitHub publish.
    - cron: '42 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # java-kotlin is absent on purpose, and neither build mode can bring it
          # back while CodeQL's Kotlin ceiling sits below ours. Measured, both:
          #
          #   manual - the traced build loads CodeQL's Kotlin compiler plugin,
          #     which refuses what it does not know ("Kotlin version 2.4.20 is
          #     too recent. CodeQL currently supports versions below 2.4.20").
          #   none - never loads that plugin, so it extracts no Kotlin, and this
          #     repo has no Java at all: "CodeQL could not process any code
          #     written in Java/Kotlin".
          #
          # Re-enable it when CodeQL supports the Kotlin in `libs.versions.toml`,
          # and check that in a run rather than from the release notes - it was
          # re-enabled once before against a Kotlin it could not read, and every
          # job failed from then until it was removed again.
          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
